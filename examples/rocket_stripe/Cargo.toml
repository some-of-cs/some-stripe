[package]
name = "rocket-stripe-example"
version = "0.8.0"
edition = "2024"
authors = ["Maher Aladdin", "Some(CS)"]
license = "Apache-2.0"
description = "Comprehensive, production-ready Rocket.rs web service example covering all some-stripe SDK services (API v1 & v2)"
readme = "README.md"

[lib]
name = "rocket_stripe_example"
path = "src/lib.rs"

[[bin]]
name = "rocket-stripe-example"
path = "src/main.rs"

[dependencies]
some-stripe = { path = "../.." }
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
