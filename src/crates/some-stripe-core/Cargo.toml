[package]
name = "some-stripe-core"
version = "0.1.0"
edition = "2024"
authors = ["Maher Aladdin", "Some(CS)"]
license = "Apache-2.0"
description = "Microkernel Core Runtime, Dual-Protocol Serialization & Concurrency Engine for some-stripe"

[dependencies]
some-stripe-types = { path = "../some-stripe-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
thiserror = "2.0.21"
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
chrono = { version = "0.4.45", features = ["serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
