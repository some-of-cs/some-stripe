[package]
name = "some-stripe-types"
version = "0.1.0"
edition = "2024"
authors = ["Maher Aladdin", "Some(CS)"]
license = "Apache-2.0"
description = "Strongly typed domain models, events, and request DTOs for some-stripe"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.1"

[dev-dependencies]
some-stripe-core = { path = "../some-stripe-core" }

