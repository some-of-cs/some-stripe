[package]
name = "some-stripe-webhooks"
version = "0.1.0"
edition = "2024"
authors = ["Maher Aladdin", "Some(CS)"]
license = "Apache-2.0"
description = "Cryptographic Webhook Engine & Edge Security Specialist for some-stripe"

[dependencies]
some-stripe-core = { path = "../some-stripe-core" }
some-stripe-types = { path = "../some-stripe-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
openssl = { version = "0.10.82", features = ["vendored"] }
chrono = { version = "0.4.45", features = ["serde"] }
subtle = "2.6.1"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
