[package]
name = "some-stripe"
version = "0.1.0"
edition = "2021"
authors = ["Maher Aladdin", "Some(CS)"]
license = "Apache-2.0"
description = "Idiomatic Rust SDK and webhook verification engine for the Stripe API, modeled after stripe-node"
repository = "https://github.com/some-of-cs/some-stripe"
documentation = "https://docs.rs/some-stripe"
keywords = ["stripe", "payments", "checkout", "webhooks", "fintech"]
categories = ["api-bindings", "finance", "web-programming"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
async-trait = "0.1"
thiserror = "1.0"
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
