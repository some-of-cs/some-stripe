[workspace]
members = [
    "src/crates/some-stripe-core",
    "src/crates/some-stripe-types",
    "src/crates/some-stripe-webhooks",
    ".",
]
exclude = [".worktrees"]

[package]
name = "some-stripe"
version = "0.8.0"
edition = "2024"
authors = ["Maher Aladdin", "Some(CS)"]
license = "Apache-2.0"
description = "Idiomatic Rust SDK and webhook verification engine for the Stripe API, modeled after stripe-node"
repository = "https://github.com/some-of-cs/some-stripe"
documentation = "https://docs.rs/some-stripe"
keywords = ["stripe", "payments", "checkout", "webhooks", "fintech"]
categories = ["api-bindings", "finance", "web-programming"]
readme = "README.md"

[dependencies]
some-stripe-core = { path = "src/crates/some-stripe-core" }
some-stripe-types = { path = "src/crates/some-stripe-types" }
some-stripe-webhooks = { path = "src/crates/some-stripe-webhooks" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
async-trait = "0.1.92"
thiserror = "2.0.21"
openssl = { version = "0.10.82", features = ["vendored"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
chrono = { version = "0.4.45", features = ["serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"
bytes = "1.10.1"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
actix-web = "4"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

